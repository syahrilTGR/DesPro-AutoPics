; --- AUTOPICS PROJECT CONFIGURATION ---
; 
; COMMANDS TO UPLOAD (Standard):
;   Gate   : pio run -e esp32dev -t upload
;   Camera : pio run -e esp32cam -t upload
;   Test RFID       : pio run -e test_rfid -t upload
;   Test Ultrasonic : pio run -e test_ultrasonic -t upload
;
; COMMANDS TO UPLOAD (WINDOWS - Full Path for PowerShell):
;   Gate   : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp32dev -t upload
;   Camera : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp32cam -t upload
;   Test RFID       : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e test_rfid -t upload
;   Test Ultrasonic : & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e test_ultrasonic -t upload
;
; COMMANDS TO UPLOAD (MAC - Full Path):
;   Gate   : ~/.platformio/penv/bin/pio run -e esp32dev -t upload
;   Camera : ~/.platformio/penv/bin/pio run -e esp32cam -t upload
;   Test RFID       : ~/.platformio/penv/bin/pio run -e test_rfid -t upload
;   Test Ultrasonic : ~/.platformio/penv/bin/pio run -e test_ultrasonic -t upload
;
; MONITOR COMMAND:
;   pio device monitor
; --------------------------------------

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Fokus hanya ke kode Pintu Gate
build_src_filter = +<main.cpp>
lib_deps =
    madhephaestus/ESP32Servo
    tzapu/WiFiManager
    bblanchon/ArduinoJson
    miguelbalboa/MFRC522
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter
upload_speed = 115200

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
; Fokus hanya ke kode Kamera
build_src_filter = +<main-espcam.cpp>
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
lib_deps =
    yoursunny/esp32cam
    tzapu/WiFiManager
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter
upload_speed = 115200

[env:test_rfid]
platform = espressif32
board = esp32dev
framework = arduino
; Fokus hanya ke kode uji coba RFID saja
build_src_filter = +<main_test_rfid.cpp>
lib_deps =
    miguelbalboa/MFRC522
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter

[env:test_ultrasonic]
platform = espressif32
board = esp32dev
framework = arduino
; Fokus hanya ke kode uji coba Ultrasonik saja
build_src_filter = +<main_test_ultrasonic.cpp>
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter
